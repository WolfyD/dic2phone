name: iOS

on:
  push:
    branches: [main, ios-port]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install XcodeGen
        env:
          XCODEGEN_URL: https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip
          XCODEGEN_SHA256: 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/xcodegen.zip" "$XCODEGEN_URL"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: ios
        run: |
          xcodebuild -version
          xcodegen generate

      # Runners carry simulators for several iOS versions; only those matching this Xcode's
      # SDK can run the build. A plain "iPhone NN" is preferred for representative screenshots.
      - name: Pick an iPhone simulator
        id: simulator
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          id=$(xcrun simctl list devices available --json | jq -r --arg runtime "iOS-${sdk%%.*}-" '
            .devices | to_entries
            | map(select(.key | contains($runtime))) | sort_by(.key) | reverse
            | map(.value[] | select(.name | startswith("iPhone")))
            | (map(select(.name | test("^iPhone [0-9]+$"))) + .)
            | first | .udid // empty')
          if [ -z "$id" ]; then
            echo "No iPhone simulator for iOS $sdk. Available:"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices | grep "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        working-directory: ios
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.id }}
        run: |
          set -o pipefail
          xcodebuild test -quiet \
            -project Dic2Phone.xcodeproj -scheme Dic2Phone \
            -destination "id=$SIMULATOR_ID" \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # LambdaTest's virtual iPhones take a zipped simulator build; both architectures are built
      # since its simulator hosts may be Intel or Apple silicon.
      - name: Build the app for LambdaTest
        working-directory: ios
        run: |
          xcodebuild build -quiet \
            -project Dic2Phone.xcodeproj -scheme Dic2Phone -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/simulator-build" \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
          ditto -c -k --keepParent \
            "$RUNNER_TEMP/simulator-build/Build/Products/Release-iphonesimulator/Dic2Phone.app" \
            "$RUNNER_TEMP/Dic2Phone-simulator.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Dic2Phone-simulator
          path: ${{ runner.temp }}/Dic2Phone-simulator.zip
          retention-days: 14

      - name: Show test failures
        if: failure()
        run: |
          [ -d "$RUNNER_TEMP/Tests.xcresult" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Tests.xcresult" \
            | jq -r '.testFailures[] | "\(.testIdentifierString): \(.failureText)"'

      - name: Export screenshots
        if: always()
        run: |
          [ -d "$RUNNER_TEMP/Tests.xcresult" ] || exit 0
          out="$RUNNER_TEMP/screenshots"
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Tests.xcresult" --output-path "$out"
          jq -r '.[].attachments[] | "\(.exportedFileName)\t\(.suggestedHumanReadableName)"' "$out/manifest.json" \
            | while IFS=$'\t' read -r exported readable; do mv "$out/$exported" "$out/$readable"; done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios-results
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
